<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
<title id="title">選點平面與側線延伸的工程流程</title>
<desc id="desc">歷史路徑以選取點群為輸入，程式自動擬合局部平面，經正側視審看。公開程式路徑從已審查支持到側線、G1線弧、約束草圖與有限延伸面。兩者都需要工程師確認形狀和焊道處理。</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#62788c" stroke-width="1.4"/></marker></defs>
<rect width="1200" height="650" fill="#f8fafc"/>
<g font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif" fill="#173249">
<text x="40" y="48" font-size="27" font-weight="700">從掃描建立可編輯貼面  兩條幾何路徑</text>
<text x="40" y="81" font-size="17">目的：減少重複建模，保留主要形狀，讓工程師集中處理局部修改</text>
<text x="40" y="133" font-size="21" font-weight="700" fill="#246e83">歷史方法　局部點群自動擬合平面</text>
<g fill="#eaf4f7" stroke="#80b6c3" stroke-width="1.5">
<rect x="40" y="156" width="240" height="111" rx="8"/><rect x="330" y="156" width="240" height="111" rx="8"/><rect x="620" y="156" width="240" height="111" rx="8"/><rect x="910" y="156" width="250" height="111" rx="8"/>
</g>
<g font-size="21" font-weight="700"><text x="62" y="191">選取局部點群</text><text x="352" y="191">程式自動擬合</text><text x="642" y="191">建立局部平面</text><text x="932" y="191">正視與側視審看</text></g>
<g font-size="17"><text x="62" y="222">先分清板面與鄰近特徵</text><text x="62" y="248">選域自動化程度待核</text><text x="352" y="222">求平面位置與方向</text><text x="352" y="248">不推定當年求解器種類</text><text x="642" y="222">顯示有限矩形範圍</text><text x="642" y="248">分區保留局部幾何</text><text x="932" y="222">看傾斜、高度與覆蓋</text><text x="932" y="248">再看多區面總覽</text></g>
<text x="40" y="324" font-size="21" font-weight="700" fill="#805d30">公開程式路徑　側線與有限線弧延伸</text>
<g fill="#fbf4e8" stroke="#c6a573" stroke-width="1.5">
<rect x="40" y="347" width="240" height="111" rx="8"/><rect x="330" y="347" width="240" height="111" rx="8"/><rect x="620" y="347" width="240" height="111" rx="8"/><rect x="910" y="347" width="250" height="111" rx="8"/>
</g>
<g font-size="21" font-weight="700"><text x="62" y="382">已審查支持與側線</text><text x="352" y="382">有限 G1 線弧</text><text x="642" y="382">VSTA 約束草圖</text><text x="932" y="382">有限方向延伸</text></g>
<g font-size="17"><text x="62" y="413">原來源與推估分列</text><text x="62" y="439">保留原缺口與未定</text><text x="352" y="413">精簡元件與尺寸重建</text><text x="352" y="439">接點、相切與距離核對</text><text x="642" y="413">端點、相切與半徑</text><text x="642" y="439">更新後原生讀回</text><text x="932" y="413">確認 Part 與計畫身分</text><text x="932" y="439">核對方向及兩側高度</text></g>
<g fill="none" stroke="#62788c" stroke-width="2" marker-end="url(#arrow)"><path d="M285 211H322"/><path d="M575 211H612"/><path d="M865 211H902"/><path d="M285 402H322"/><path d="M575 402H612"/><path d="M865 402H902"/></g>
<text x="40" y="520" font-size="23" font-weight="700">工程師接續：主要輪廓、肩部範圍、焊道簡化、剩餘微調</text>
<text x="40" y="558" font-size="18">歷史平面圖集與現行三側原生收據分版記錄；畫面覆蓋不等於接觸或縫合驗收。</text>
<text x="40" y="593" font-size="18">精度作診斷。省時幅度需量測，不能由面數或元件數直接換算。</text>
<text x="40" y="627" font-size="15" fill="#526879">流程示意，未使用實件座標；圖號不代表操作時序。</text>
</g></svg>
