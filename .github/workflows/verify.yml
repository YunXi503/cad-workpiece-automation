name: Portfolio verification
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  offline:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: dotnet build src/Cli -c Release
      - run: dotnet run --project tests/GeometryChecks -c Release
      - run: python tests/stl_input_acceptance.py
      - run: python tests/source_acceptance.py
      - run: python tests/case_a_evidence.py
      - run: python tests/portfolio_consistency.py
      - run: python tests/surface_display.py
      - run: python tests/acceptance.py
      - run: python tests/arm_acceptance.py
      - run: python tests/check_docs.py
      - run: python tools/audit_publication.py --check-inventory
      - if: runner.os == 'Windows'
        run: dotnet build src/Viewer -c Release
      - if: runner.os == 'Windows'
        run: python tests/viewer_open.py
      - if: runner.os == 'Windows'
        run: python tests/viewer_workflow.py
